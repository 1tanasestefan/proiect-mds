name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vacation-planner/frontend

    env:
      NEXT_PUBLIC_ITINERARY_API_URL: http://127.0.0.1:8000/api/generate-itinerary
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vacation-planner/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Python backend import check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vacation-planner/backend

    env:
      LOCAL_LLM_BASE_URL: http://localhost:11434
      LOCAL_LLM_MODEL: llama3.1:8b
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: dummy-service-role-key-for-ci
      SUPABASE_JWT_SECRET: dummy-jwt-secret-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vacation-planner/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify backend imports
        run: python -c "import main; print('Backend imports successfully')"

      - name: Run backend tests
        run: pytest -q

      - name: Run offline agent evaluation
        run: python agent_eval.py --mode offline --threshold 0.75 --json

  java-backend:
    name: Java backend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vacation-planner/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Java backend
        run: mvn test
